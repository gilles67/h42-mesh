! Generated by h42-mesh-agent: do not edit, changes are overwritten.
frr defaults traditional
log syslog informational
service integrated-vtysh-config
!
bfd
 profile h42-active
  detect-multiplier 3
  receive-interval 300
  transmit-interval 300
 exit
 !
exit
!
ip prefix-list H42-EXCLUDED-V4 seq 5 permit 169.254.0.0/16 le 32
ip prefix-list H42-EXCLUDED-V4 seq 10 permit 127.0.0.0/8 le 32
!
ipv6 prefix-list H42-EXCLUDED-V6 seq 5 permit fe80::/10 le 128
ipv6 prefix-list H42-EXCLUDED-V6 seq 10 permit ::1/128
!
bgp large-community-list expanded H42-BACKUP-ROUTES permit _[0-9]+:1:2_
!
! Networks of the default VRF, without tunnels, loopback and containers.
route-map H42-CONNECTED deny 10
 match ip address prefix-list H42-EXCLUDED-V4
exit
!
route-map H42-CONNECTED deny 20
 match ipv6 address prefix-list H42-EXCLUDED-V6
exit
!
route-map H42-CONNECTED deny 100
 match interface br-0123456789ab
exit
!
route-map H42-CONNECTED deny 101
 match interface docker0
exit
!
route-map H42-CONNECTED deny 102
 match interface lo
exit
!
route-map H42-CONNECTED deny 103
 match interface veth1a2b
exit
!
route-map H42-CONNECTED deny 104
 match interface wd0c0rootr0c0
exit
!
route-map H42-CONNECTED deny 105
 match interface wd0c1rootr0c0
exit
!
route-map H42-CONNECTED permit 65000
exit
!
! Any route that went through a backup tunnel somewhere: low preference.
route-map H42-IN permit 10
 match large-community H42-BACKUP-ROUTES
 set local-preference 50
exit
!
route-map H42-IN permit 20
exit
!
! Received on a backup tunnel: marked, and low preference.
route-map H42-IN-BACKUP permit 10
 set large-community 4200000001:1:2 additive
 set local-preference 50
exit
!
route-map H42-OUT permit 10
exit
!
router bgp 4200000001
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor H42-ACTIVE peer-group
 neighbor H42-ACTIVE capability extended-nexthop
 neighbor H42-ACTIVE bfd profile h42-active
 neighbor H42-BACKUP peer-group
 neighbor H42-BACKUP capability extended-nexthop
 neighbor H42-BACKUP timers 60 180
 neighbor fe80::a9fe:a00 remote-as 4200000000
 neighbor fe80::a9fe:a00 peer-group H42-ACTIVE
 neighbor fe80::a9fe:a00 interface wd0c0rootr0c0
 neighbor fe80::a9fe:a00 description root r0 c0 active
 neighbor fe80::a9fe:b00 remote-as 4200000000
 neighbor fe80::a9fe:b00 peer-group H42-BACKUP
 neighbor fe80::a9fe:b00 interface wd0c1rootr0c0
 neighbor fe80::a9fe:b00 description root r0 c0 backup
 !
 address-family ipv4 unicast
  redistribute connected route-map H42-CONNECTED
  neighbor H42-ACTIVE activate
  neighbor H42-ACTIVE send-community large
  neighbor H42-ACTIVE route-map H42-IN in
  neighbor H42-ACTIVE route-map H42-OUT out
  neighbor H42-BACKUP activate
  neighbor H42-BACKUP send-community large
  neighbor H42-BACKUP route-map H42-IN-BACKUP in
  neighbor H42-BACKUP route-map H42-OUT out
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected route-map H42-CONNECTED
  neighbor H42-ACTIVE activate
  neighbor H42-ACTIVE send-community large
  neighbor H42-ACTIVE route-map H42-IN in
  neighbor H42-ACTIVE route-map H42-OUT out
  neighbor H42-BACKUP activate
  neighbor H42-BACKUP send-community large
  neighbor H42-BACKUP route-map H42-IN-BACKUP in
  neighbor H42-BACKUP route-map H42-OUT out
 exit-address-family
 !
exit
!
