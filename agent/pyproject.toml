[project]
name = "h42-mesh-agent"
version = "0.1.0"
description = "h42-mesh agent for routers and VPS"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.scripts]
h42-mesh-agent = "h42mesh.agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h42mesh"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ANN"]

[tool.mypy]
strict = true
mypy_path = "src,tests"
files = ["src", "tests"]
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
