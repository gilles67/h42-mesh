[project]
name = "h42-mesh-controller"
version = "0.1.0"
description = "h42-mesh mesh VPN controller (API)"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "tortoise-orm>=1.1.9,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "tzdata>=2024.1",
    "cryptography>=44",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h42mesh"]

[tool.tortoise]
tortoise_orm = "h42mesh.controller.db.TORTOISE_ORM"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/h42mesh/controller/migrations/0*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.mypy]
strict = true
mypy_path = "src,tests"
files = ["src", "tests"]
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
exclude = ["src/h42mesh/controller/migrations/0.*\\.py$"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: tests requiring PostgreSQL (roadmap step 6)"]
